<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 650" width="100%" height="100%">
  <defs>
    <style>
      .bg { fill: #070b14; }
      .box-body { fill: #1e293b; stroke: #38bdf8; stroke-width: 2.5; }
      .box-lid { fill: #0f172a; stroke: #00f0ff; stroke-width: 2; opacity: 0.95; }
      .gland { fill: #334155; stroke: #94a3b8; stroke-width: 2; }
      .glass { fill: #070b14; stroke: #00f0ff; stroke-width: 1.5; }
      .led-green { fill: #10b981; filter: drop-shadow(0 0 6px #10b981); }
      .led-red { fill: #f43f5e; }
      .flange { fill: #334155; stroke: #64748b; stroke-width: 1.5; }
      .dim { stroke: #eab308; stroke-dasharray: 3,3; stroke-width: 1.5; }
      .text-title { fill: #ffffff; font-family: 'Plus Jakarta Sans', sans-serif; font-size: 16px; font-weight: bold; }
      .text-dim { fill: #eab308; font-family: monospace; font-size: 11px; }
      .text-label { fill: #94a3b8; font-family: monospace; font-size: 10px; }
    </style>
  </defs>

  <rect width="900" height="650" class="bg"/>

  <!-- Title Block -->
  <text x="50" y="45" class="text-title">TELDS Hardware Enclosure — 3D Mechanical Isometric Blueprint</text>
  <text x="50" y="65" class="text-label">Doc: CAD-TELDS-ENC-V1 • IP54 Rated Polycarbonate Casing • Dual PG9 Cable Glands</text>

  <!-- ISOMETRIC PROJECTION -->
  <g transform="translate(180, 160)">
    <!-- Mounting Flanges (Back) -->
    <polygon points="-40,180 -10,160 -10,210 -40,230" class="flange"/>
    <circle cx="-25" cy="195" r="5" fill="#070b14"/>
    <polygon points="530,30 560,10 560,60 530,80" class="flange"/>
    <circle cx="545" cy="45" r="5" fill="#070b14"/>

    <!-- Enclosure Base Body (Isometric) -->
    <!-- Front Face -->
    <polygon points="0,200 380,390 380,480 0,290" class="box-body"/>
    <!-- Right Face -->
    <polygon points="380,390 540,310 540,400 380,480" class="box-body" fill="#142145"/>
    <!-- Bottom Rim / Base Lines -->
    <polyline points="0,290 380,480 540,400" stroke="#00f0ff" stroke-width="2" fill="none"/>

    <!-- PG9 Cable Glands on Left Face -->
    <!-- Gland 1: CT1 Input -->
    <ellipse cx="90" cy="245" rx="14" ry="24" class="gland"/>
    <path d="M 90 221 L 50 200 L 50 248 L 90 269 Z" class="gland"/>
    <text x="10" y="275" class="text-label">PG9 (CT1 Cable)</text>

    <!-- Gland 2: CT2 Output -->
    <ellipse cx="190" cy="295" rx="14" ry="24" class="gland"/>
    <path d="M 190 271 L 150 250 L 150 298 L 190 319 Z" class="gland"/>
    <text x="110" y="325" class="text-label">PG9 (CT2 Cable)</text>

    <!-- Gland 3: Mains AC Power on Right Face -->
    <ellipse cx="460" cy="355" rx="14" ry="22" class="gland"/>
    <text x="490" y="380" class="text-label">PG7 (230V AC)</text>

    <!-- Enclosure Top Lid (Hovering Isometric) -->
    <g transform="translate(0, -90)">
      <!-- Top Face of Lid -->
      <polygon points="0,180 380,370 540,290 160,100" class="box-lid"/>
      <!-- Left Edge of Lid -->
      <polygon points="0,180 380,370 380,385 0,195" fill="#1e293b" stroke="#00f0ff"/>
      <!-- Right Edge of Lid -->
      <polygon points="380,370 540,290 540,305 380,385" fill="#0f172a" stroke="#00f0ff"/>

      <!-- OLED Display Window -->
      <polygon points="200,240 320,300 360,280 240,220" class="glass"/>
      <text x="250" y="270" fill="#00f0ff" font-family="monospace" font-size="9" transform="rotate(27, 250, 270)">TELDS OLED 0.96"</text>

      <!-- Status Indicator LEDs -->
      <ellipse cx="180" cy="245" rx="4" ry="6" class="led-green"/>
      <ellipse cx="380" cy="285" rx="4" ry="6" class="led-red"/>

      <!-- Acoustic Buzzer Grille -->
      <line x1="280" y1="330" x2="300" y2="340" stroke="#64748b" stroke-width="2"/>
      <line x1="285" y1="335" x2="305" y2="345" stroke="#64748b" stroke-width="2"/>
      <line x1="290" y1="340" x2="310" y2="350" stroke="#64748b" stroke-width="2"/>

      <!-- Lid Corner Screw Holes -->
      <circle cx="20" cy="180" r="3" fill="#ffffff"/>
      <circle cx="365" cy="355" r="3" fill="#ffffff"/>
      <circle cx="525" cy="285" r="3" fill="#ffffff"/>
      <circle cx="170" cy="115" r="3" fill="#ffffff"/>
    </g>

    <!-- Exploded Projection Dashed Guide Lines -->
    <line x1="0" y1="180" x2="0" y2="90" stroke="#00f0ff" stroke-dasharray="4,4"/>
    <line x1="380" y1="370" x2="380" y2="280" stroke="#00f0ff" stroke-dasharray="4,4"/>
    <line x1="540" y1="290" x2="540" y2="200" stroke="#00f0ff" stroke-dasharray="4,4"/>
  </g>

  <!-- Dimensions Callouts -->
  <line x1="160" y1="480" x2="540" y2="670" class="dim"/>
  <text x="320" y="600" class="text-dim">Length: 140.0 mm</text>

  <line x1="580" y1="630" x2="740" y2="550" class="dim"/>
  <text x="670" y="605" class="text-dim">Width: 100.0 mm</text>

  <line x1="750" y1="520" x2="750" y2="430" class="dim"/>
  <text x="760" y="480" class="text-dim">Height: 50.0 mm</text>

  <rect x="50" y="550" width="380" height="70" rx="6" fill="#0f172a" stroke="#1e293b"/>
  <text x="65" y="575" fill="#ffffff" font-family="sans-serif" font-size="11" font-weight="bold">Mechanical Characteristics:</text>
  <text x="65" y="595" class="text-label">• Material: UV-Resistant Polycarbonate (UL94 V-0)</text>
  <text x="65" y="610" class="text-label">• Gasket: 2.5mm Neoprene O-ring Seal (IP54 Rated)</text>
</svg>
